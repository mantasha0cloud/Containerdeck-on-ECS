version: 0.2

env:
  variables:
    CONTAINER_NAME: "containerdeck-frontend"

phases:
  install:
    runtime-versions:
      docker: 20
    commands:
      - echo "Install phase - nothing extra to install"

  pre_build:
    commands:
      - echo "Pre-build phase - running source tests"
      - chmod +x tests/test.sh tests/docker-test.sh
      - ./tests/test.sh
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

  build:
    commands:
      - echo "Build phase - building Docker image"
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest .
      - echo "Running Docker image smoke test..."
      - ./tests/docker-test.sh $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Post-build phase - pushing image to ECR"
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Writing imagedefinitions.json for ECS deploy stage"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
